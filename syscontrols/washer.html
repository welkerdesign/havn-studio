<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Washer · HAVN SysControls</title>
  <link rel="stylesheet" href="washer.css">
  <script defer src="programs.js"></script>
  <script defer src="washer.js"></script>
</head>
<body>
  <main>
    <header><div><p class="product">HAVN / Artek SysControls</p><h1>Washer</h1></div><span class="mode">Simulation</span></header>
    <div class="layout">
      <nav aria-label="Wash programs"><h2>Programs</h2><div id="programs"></div></nav>
      <section aria-labelledby="program-title">
        <h2 id="program-title"></h2><p id="description"></p>
        <dl id="settings"></dl>
        <label id="extra-label" hidden><input type="checkbox" id="extra"> Extra spin <span>+1 minute at 1,075 rpm</span></label>
        <p id="evidence"></p>
        <div class="actions"><button class="primary" id="start">Preview cycle</button><button id="export">Export recipe</button></div>
        <article id="playback" hidden>
          <div class="line"><h3 id="phase" aria-live="polite"></h3><span id="clock"></span></div>
          <progress id="progress" aria-label="Program steps"></progress>
          <p id="outputs"></p><p id="prompt" role="status"></p>
          <div class="actions"><button id="fill" class="primary" hidden>Simulate fill and confirm</button><button id="end">End preview</button>
          <label for="speed">Playback <select id="speed"><option value="1">1×</option><option selected value="12">12×</option><option value="60">60×</option></select></label></div>
        </article>
      </section>
    </div>
    <details><summary>Compare programs</summary><div class="scroll"><table><caption>Preset targets · fill height in mm above the wardrobe floor</caption>
      <thead><tr><th>Program</th><th>Wash / rinse level</th><th>Tumble</th><th>Rinses</th><th>Final spin</th></tr></thead>
      <tbody id="comparison"></tbody></table></div></details>
  </main>
</body></html>
